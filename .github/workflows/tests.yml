name: Tests

on:
  pull_request:
    branches: [main]
    # No `paths-ignore` here, deliberately -- do not add one back.
    #
    # The `pest / PHP ...` contexts this workflow produces are REQUIRED by this
    # repository's branch protection. A filter that skips the job does not make
    # the check pass; it means the context never arrives, and a required context
    # that never reports blocks a pull request FOREVER rather than failing it.
    #
    # That is how three markdown-only pull requests in this family ended up
    # reading "green but blocked": every check that ran was green, and the ones
    # that mattered had never run at all.
    #
    # If a filter is wanted here, unrequire the contexts in branch protection
    # first, or publish them from a stub job on the inverse filter.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Calls the one shared definition in laranail/.github. Everything this file used
# to spell out -- the PHP matrix, the composer cache and its laranail eviction,
# prefer-lowest, fail-fast, timeouts -- lives there now, so a change to how this
# family tests is one edit instead of fifty.
jobs:
  pest:
    uses: laranail/.github/.github/workflows/tests.yml@main
    with:
      # Pin nothing: resolve whatever composer.json allows. The shared workflow
      # still defaults laravel-versions to ["13.*"], which runs
      # `composer require illuminate/contracts` and REWRITES composer.json, so
      # the suite would test a manifest this package does not ship. Remove this
      # line only once that default is ["*"].
      laravel-versions: '["*"]'
      php-extensions: 'dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite3, pdo_sqlite'
