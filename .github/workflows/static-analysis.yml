name: Static analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Catch alias drift on main, not only at release time. The release gate alone is
  # too late to be comfortable: by then the mistake is already in the commit being
  # tagged and the fix is a re-tag. Here it is a one-line edit.
  branch-alias:
    name: Branch alias
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the drift check compares against the newest tag

      - name: Assert branch-alias has not fallen behind the newest tag
        run: bash .scripts/check-branch-alias.sh

  # Split by tool rather than run all three in one job.
  #
  # This package ships no composer.lock (correct for a library), so CI resolves
  # the toolchain fresh on every run. That makes the analysers vulnerable to
  # upstream drift between themselves: Rector reaches into PHPStan internals via
  # PrivatesAccessor, and an incompatible pair fatals rather than reporting
  # findings. It has happened once already — run 30242027388 died with
  # MissingPrivatePropertyException on PHPStan\Parser\RichParser::$container,
  # and was green again days later with no code change.
  #
  # Run sequentially in one job, that fatal reddens the whole job and buries the
  # Pint/PHPStan verdict that had already passed. Separate jobs with
  # fail-fast: false keep each tool's signal independent, so a toolchain break in
  # one is visibly a break in that one — not "static analysis is failing".
  static:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pint · PHPStan
            commands: |
              vendor/bin/pint --test
              vendor/bin/phpstan analyse --no-progress --error-format=github
          - name: Rector
            commands: |
              vendor/bin/rector process --dry-run --no-progress-bar

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Cache Composer files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-static-${{ hashFiles('composer.json') }}
          restore-keys: composer-static-

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      # The toolchain is resolved fresh each run, so record what it actually
      # resolved to. When an analyser fatals on an upstream incompatibility, this
      # is the only record of which pair caused it — without it the failure is
      # unreproducible after the fact.
      - name: Report resolved analyser versions
        run: |
          for pkg in laravel/pint phpstan/phpstan larastan/larastan rector/rector; do
            printf '%-22s %s\n' "$pkg" "$(composer show "$pkg" 2>/dev/null | awk '/^versions/{print $NF}')"
          done

      - name: ${{ matrix.name }}
        run: ${{ matrix.commands }}
