name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '14 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Resolve composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-security-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-security-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's dist
        # cache is keyed on a name whose contents change underneath it. A restored
        # archive is then silently stale: the install reports success and unpacks
        # whatever was cached the first time. Everything else is immutable per
        # version and stays cached.
        # POSIX command via bash: Windows runners default to PowerShell, where this
        # would be a parse error rather than a no-op.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --no-interaction

  # The OSV scan and the secret scan this repository has never had. The local `audit` job above is
  # deliberately left alone: it caches composer, pins its own PHP, and on some repos runs through a
  # container action -- none of which the shared workflow does. Running both is the pilot; dropping
  # the duplicate `composer audit` is a separate decision, with evidence, once this has run.
  shared:
    name: shared scans (OSV, secrets)
    uses: laranail/.github/.github/workflows/security.yml@main
    with:
      php-version: '8.5'
      php-extensions: 'dom, curl, libxml, mbstring, zip, fileinfo'
    # Carries OP_SERVICE_ACCOUNT_TOKEN through for the ggshield step. The shared workflow declares it
    # optional and skips the scan with a warning when it is absent, so this is correct before the
    # credential exists as well as after.
    secrets: inherit
