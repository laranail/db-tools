name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release + SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs before anything is built or published. A branch-alias that lags the
      # tag makes the default branch advertise an old minor, so Composer offers
      # main to consumers pinned to that minor and hands them the newer, possibly
      # breaking, code. Failing here costs a re-tag; publishing costs a silent BC
      # break in every downstream lock file.
      - name: Assert branch-alias matches the tag
        run: bash .scripts/check-branch-alias.sh --release "$GITHUB_REF_NAME"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: db-tools.cdx.json
          upload-artifact: false
          upload-release-assets: false   # the release step below attaches the SBOM (avoids a duplicate asset)

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/laranail/db-tools/blob/main/CHANGELOG.md) for details." > release-notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          body_path: release-notes.md
          files: db-tools.cdx.json
